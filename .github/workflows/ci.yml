name: CI

# Every job below runs on a GitHub-hosted runner (`ubuntu-latest`,
# `macos-latest` or `windows-latest`); no self-hosted runner is required.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    # Makefile recipes below rely on POSIX shell syntax, which is not the
    # default on Windows runners.
    shell: bash

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:

  ########
  # Gate #
  ########

  # Single required status check: stays red whenever any check below fails,
  # including when a job never starts. Make this the required check in the
  # branch protection rules of `main`.
  ci-success:
    if: ${{ always() }}
    needs:
      - clippy
      - direct-minimal-versions
      - feature
      - msrv
      - rustdoc
      - rustfmt
      - test
      - test-book
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report results of required jobs
        run: |
          echo 'clippy:                  ${{ needs.clippy.result }}'
          echo 'direct-minimal-versions: ${{ needs.direct-minimal-versions.result }}'
          echo 'feature:                 ${{ needs.feature.result }}'
          echo 'msrv:                    ${{ needs.msrv.result }}'
          echo 'rustdoc:                 ${{ needs.rustdoc.result }}'
          echo 'rustfmt:                 ${{ needs.rustfmt.result }}'
          echo 'test:                    ${{ needs.test.result }}'
          echo 'test-book:               ${{ needs.test-book.result }}'
      - name: Fail if any required job did not succeed
        if: ${{ contains(needs.*.result, 'failure')
             || contains(needs.*.result, 'cancelled')
             || contains(needs.*.result, 'skipped') }}
        run: |
          echo '::error::Some required CI checks did not succeed.'
          exit 1




  ##########################
  # Linting and formatting #
  ##########################

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - run: make cargo.lint

  rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
          components: rustfmt

      - run: make cargo.fmt check=yes




  ###########
  # Testing #
  ###########

  feature:
    strategy:
      fail-fast: false
      matrix:
        feature:
          - <none>
          - macros
          - timestamps
          - output-json
          - output-junit
          - libtest
          - tracing
          - observability
          - macros,timestamps,tracing
          - output-json,output-junit,libtest
          - <all>
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo +nightly update -Z minimal-versions

      - name: Check `cucumber` with `${{ matrix.feature }}` feature(s)
        run: |
          case '${{ matrix.feature }}' in
            '<none>') features='' ;;
            '<all>')  features='--all-features' ;;
            *)        features='--features ${{ matrix.feature }}' ;;
          esac
          cargo check -p cucumber --no-default-features $features
        env:
          RUSTFLAGS: -D warnings

  direct-minimal-versions:
    name: minimal versions (declared)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2

      # `-Z minimal-versions` lets a transitive requirement lift a direct
      # dependency above the version declared for it here, so a declared
      # minimum that doesn't work is never built by that job. This one pins
      # every direct dependency to exactly what its manifest declares.
      - run: cargo +nightly update -Z direct-minimal-versions

      - run: cargo check --workspace --all-features
        env:
          RUSTFLAGS: -D warnings

      # The `Step`s of a `World` register at link time, and an `inventory` too
      # old for the toolchain registers none of them without failing to build,
      # so the check above cannot stand in for running the tests.
      - run: make test.cargo crate=cucumber

  msrv:
    name: MSRV
    strategy:
      fail-fast: false
      matrix:
        msrv: ["1.88.0"]
        crate:
          - cucumber-codegen
          - cucumber
        os: ["ubuntu", "macos", "windows"]
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.msrv }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.msrv }}-${{ matrix.crate }}

      - name: Verify MSRV matches the `rust-version` of Cargo manifests
        run: |
          for manifest in Cargo.toml codegen/Cargo.toml; do
            declared="$(grep -m1 '^rust-version = "' "$manifest" \
                        | cut -d '"' -f2)"
            echo "$manifest declares MSRV $declared"
            test "${{ matrix.msrv }}" = "$declared.0" \
              || test "${{ matrix.msrv }}" = "$declared"
          done

      - run: cargo +nightly update -Z minimal-versions

      - run: make test.cargo crate=${{ matrix.crate }}

  test:
    strategy:
      fail-fast: false
      matrix:
        crate:
          - cucumber-codegen
          - cucumber
        toolchain: ["stable", "beta", "nightly"]
        os: ["ubuntu", "macos", "windows"]
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}-${{ matrix.crate }}

      - run: cargo install cargo-careful --locked
        if: ${{ matrix.toolchain == 'nightly' }}

      - run: make test.cargo crate=${{ matrix.crate }}
                  careful=${{ (matrix.toolchain == 'nightly' && 'yes')
                           ||                                   'no' }}

  test-book:
    name: test (Book, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu", "macos", "windows"]
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: book
          # `make test.book` passes `-L target/debug/deps` to `mdbook test`,
          # which resolves each `extern crate` by scanning that directory. A
          # restored `target/` still holds the rlibs of the dependency graph it
          # was saved with, so as soon as that graph changes, the stale rlib and
          # the freshly built one both sit there and `rustc` fails with `E0464:
          # multiple candidates for rlib dependency` rather than picking one.
          # Cache only `~/.cargo`, so the registry is still reused but the build
          # artifacts `-L` sees are always exactly this run's.
          cache-targets: "false"
      - uses: peaceiris/actions-mdbook@v2
        with:
          # Pinned: mdBook 0.5 renamed `book.toml` keys, so an unpinned
          # `latest` can break the Book build without a commit here.
          mdbook-version: "0.5.4"

      - run: make test.book




  #################
  # Documentation #
  #################

  rustdoc:
    strategy:
      fail-fast: false
      matrix:
        crate:
          - cucumber-codegen
          - cucumber
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: doc-${{ matrix.crate }}

      - run: make cargo.doc crate=${{ matrix.crate }}
                            private=yes docsrs=yes deps=no
                            open=no
        env:
          RUSTFLAGS: -D warnings




  #############
  # Releasing #
  #############

  publish:
    name: publish (crates.io)
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: ["release-github"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - run: cargo publish -p cucumber-codegen
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATESIO_TOKEN }}

      - run: cargo publish -p cucumber
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATESIO_TOKEN }}

  release-github:
    name: release (GitHub)
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: ["ci-success"]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Parse release version
        id: release
        run: echo "version=${GITHUB_REF#refs/tags/v}"
             >> $GITHUB_OUTPUT
      - name: Verify release version matches `cucumber-codegen` Cargo manifest
        run: |
          test "${{ steps.release.outputs.version }}" \
            == "$(grep -m1 'version = "' codegen/Cargo.toml | cut -d '"' -f2)"
      - name: Verify release version matches `cucumber` Cargo manifest
        run: |
          test "${{ steps.release.outputs.version }}" \
            == "$(grep -m1 'version = "' Cargo.toml | cut -d '"' -f2)"

      - name: Ensure CHANGELOG date is today
        run: |
          today="$(date '+%Y-%m-%d')"
          changelog="$(grep -E '^## \[${{ steps.release.outputs.version }}\] ·'\
                            CHANGELOG.md \
                       | cut -d' ' -f4 | tr -d ' ')"
          echo "Changelog: $changelog"
          echo "Today: $today"
          [ "$changelog" = "$today" ]
      - name: Parse CHANGELOG link
        id: changelog
        run: echo "link=${{ github.server_url }}/${{ github.repository }}/blob/v${{ steps.release.outputs.version }}/CHANGELOG.md#$(sed -n '/^## \[${{ steps.release.outputs.version }}\]/{s/^## \[\(.*\)\][^0-9]*\([0-9].*\)/\1--\2/;s/[^0-9a-z-]*//g;p;}' CHANGELOG.md)"
             >> $GITHUB_OUTPUT

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release.outputs.version }}
          body: |
            [API docs](https://docs.rs/cucumber/${{ steps.release.outputs.version }})
            [Changelog](${{ steps.changelog.outputs.link }})
          prerelease: ${{ contains(steps.release.outputs.version, '-') }}




  ##########
  # Deploy #
  ##########

  deploy-book:
    name: deploy (Book)
    if: ${{ github.ref == 'refs/heads/main'
         || startsWith(github.ref, 'refs/tags/v') }}
    needs: ["test-book"]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: peaceiris/actions-mdbook@v2
        with:
          # Pinned: mdBook 0.5 renamed `book.toml` keys, so an unpinned
          # `latest` can break the Book build without a commit here.
          mdbook-version: "0.5.4"

      - run: make book.build
                  out=gh-pages/${{ (github.ref == 'refs/heads/main'
                                    && 'main')
                                ||     'current' }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          keep_files: true
          publish_dir: book/gh-pages
